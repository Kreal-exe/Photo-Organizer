# Every push to main: the macOS app is tested and built, the Windows app is built, and both are published as the
# GitHub release v<VERSION> (the file VERSION). While VERSION stays the same, each push replaces that release's files
# and moves its tag to the new commit; a new version number makes a new release. Pull requests are built and tested only.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          INSTALL_DIR: ${{ runner.temp }}/Applications
        run: ./build.sh --test --zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/PhotoOrganizer-macOS-v${{ needs.version.outputs.version }}.zip

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        env:
          INSTALL_DIR: ${{ runner.temp }}\PhotoOrganizer
        run: |
          ./build.ps1 -Zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PhotoOrganizer-Windows-v${{ needs.version.outputs.version }}.zip

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The same version again: the tag moves to this commit and the files are replaced.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" dist/*.zip --clobber
            # Files of an earlier build that this one no longer makes (a renamed archive) are removed.
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              [ -e "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --title "Photo Organizer $TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "Photo Organizer $TAG" \
              --generate-notes \
              --notes-file .github/release-notes.md
          fi

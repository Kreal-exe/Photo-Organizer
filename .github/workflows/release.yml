# Every push to main: the macOS app is tested and built, the Windows app is built, and both are published as a new
# GitHub release v<VERSION>.<run number> (VERSION holds major.minor). Pull requests are built and tested only.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./build.sh test
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/PhotoOrganizer-${{ needs.version.outputs.version }}.zip

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./build.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path build/PhotoOrganizer-Windows/* -DestinationPath "build/PhotoOrganizer-Windows-$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/PhotoOrganizer-Windows-${{ needs.version.outputs.version }}.zip

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Photo Organizer $TAG" \
            --generate-notes \
            --notes-file .github/release-notes.md
